Marcus",shortLine:"Learning to stay in the room.",currentlyNavigating:["self-worth"],sectionsOpen:!0},priya:{id:"priya",displayName:"Priya"},theo:{id:"theo",displayName:"Theo",shortLine:"Six months into doing the work.",currentlyNavigating:["healing"],learning:"Being alone and being lonely are different things.",sectionsOpen:!0},nadia:{id:"nadia",displayName:"Nadia",shortLine:"Finding my way back, on my own terms.",currentlyNavigating:["faith","identity"],learning:"Faith can hold questions too.",sectionsOpen:!0},elena:{id:"elena",displayName:"Elena",shortLine:"Mom of two, student of one: me.",currentlyNavigating:["family","growth"],sectionsOpen:!0},kofi:{id:"kofi",displayName:"Kofi"},anon1:{id:"anon1",displayName:""},anon2:{id:"anon2",displayName:""},anon3:{id:"anon3",displayName:""},anon4:{id:"anon4",displayName:""}},jb=100,_e=()=>jb--,kh=[{id:"jordan-35",authorId:"jordan",anonymous:!1,experiences:["starting-over"],audience:"open",circleId:null,support:"relate",contentNote:null,postedLabel:"3h ago",postedOrder:_e(),text:"I'm 35 and I feel like everyone else has figured life out except me. I've been carrying so much shame about starting over, but I'm finally learning that my timeline doesn't have to look like anyone else's.",replies:[{id:"r-lena-1",authorId:"lena",anonymous:!1,postedLabel:"2h ago",text:"I started over at 41. The shame was loudest right before it got quieter. You're not behind.",children:[{id:"r-jordan-1",authorId:"jordan",anonymous:!1,postedLabel:"1h ago",text:`"Loudest right before it got quieter." I'm writing that on a sticky note. Thank you.`,children:[]}]},{id:"r-marcus-1",authorId:"marcus",anonymous:!1,postedLabel:"1h ago",text:"Same here. Thirty-eight, new city, new job. Some days I'm proud, some days I'm just tired. Both count.",children:[]}]},{id:"anon-fourth-no",authorId:"anon1",anonymous:!0,experiences:["rejection"],audience:"circle",circleId:"rejection-resilience",support:"listen",contentNote:null,postedLabel:"4h ago",postedOrder:_e(),text:"Got the email today. Fourth final round, fourth no. I'm not asking for advice. I just needed to say it somewhere people understand.",replies:[]},{id:"nadia-way-back",authorId:"nadia",anonymous:!1,experiences:["faith","identity"],audience:"open",circleId:null,support:"relate",contentNote:null,postedLabel:"5h ago",postedOrder:_e(),text:"I grew up in church, stepped away for years, and I'm slowly finding my way back on my own terms. Some days it looks like prayer. Some days it's just sitting still and letting myself ask the questions I used to be afraid of.",replies:[{id:"r-elena-1",authorId:"elena",anonymous:!1,postedLabel:"3h ago",text:"The questions I used to be afraid of are the ones that eventually brought me home. Different path, same feeling. I'm glad you're asking them.",children:[]}]},{id:"maya-pottery",authorId:"maya",anonymous:!1,experiences:["loneliness","belonging"],audience:"open",circleId:null,support:"encourage",contentNote:null,postedLabel:"6h ago",postedOrder:_e(),text:"Moved to a new city for work six months ago. My weekends are so quiet I can hear the fridge. Tonight I'm going to a pottery class alone. Wish me luck.",replies:[{id:"r-priya-1",authorId:"priya",anonymous:!1,postedLabel:"4h ago",text:"Good luck! Going alone the first time is the hardest part, and you're already doing it.",children:[]}]},{id:"dev-chemistry",authorId:"dev",anonymous:!1,experiences:["career"],audience:"circle",circleId:"career-purpose",support:"perspective",contentNote:null,postedLabel:"7h ago",postedOrder:_e(),text:"Left a stable analyst job to teach high school chemistry. The pay cut is real. Some days I wonder if I romanticized it. For those who made a big change: how did you know it was right?",replies:[{id:"r-sam-1",authorId:"sam",anonymous:!1,postedLabel:"5h ago",text:"I didn't know for about a year. What told me was noticing I'd stopped dreading Sunday nights.",children:[]}]},{id:"anon-sunday-calls",authorId:"anon2",anonymous:!0,experiences:["grief"],audience:"open",circleId:null,support:"relate",contentNote:"Loss",postedLabel:"9h ago",postedOrder:_e(),text:"It's been a year since my mom died. Everyone expects me to be better now. I still pick up the phone to call her on Sunday mornings, and for one second I forget.",replies:[]},{id:"rosa-music",authorId:"rosa",anonymous:!1,experiences:["finding-myself"],audience:"circle",circleId:"finding-myself",support:"relate",contentNote:null,postedLabel:"10h ago",postedOrder:_e(),text:"At 52 I'm realizing I spent my whole life being who others needed. I don't actually know what music I like. So I'm starting there. This week: old Nina Simone records and a lot of skipping.",replies:[]},{id:"sam-rest",authorId:"sam",anonymous:!1,experiences:["burnout"],audience:"open",circleId:null,support:"resources",contentNote:null,postedLabel:"12h ago",postedOrder:_e(),text:"Three weeks off work for burnout. Sleeping better. Still feel guilty every time I rest. What helped you stop treating rest like something you have to earn?",replies:[]},{id:"lena-yellow-kitchen",authorId:"lena",anonymous:!1,experiences:["starting-over","relationships"],audience:"circle",circleId:"starting-over",support:"encourage",contentNote:null,postedLabel:"1d ago",postedOrder:_e(),text:"Signed the lease on my first apartment after the divorce. It's small and the kitchen is yellow and it's mine.",replies:[]},{id:"marcus-mens-group",authorId:"marcus",anonymous:!1,experiences:["self-worth"],audience:"open",circleId:null,support:"relate",contentNote:null,postedLabel:"1d ago",postedOrder:_e(),text:"Tried a men's group for the first time. Didn't say much. But I stayed the whole time, and for me that's something.",replies:[]},{id:"anon-phone-call",authorId:"anon3",anonymous:!0,experiences:["anxiety"],audience:"open",circleId:null,support:"listen",contentNote:null,postedLabel:"1d ago",postedOrder:_e(),text:"Made the phone call I'd been avoiding for two weeks. Hands shaking the whole time. It's done.",replies:[]},{id:"elena-bedtime",authorId:"elena",anonymous:!1,experiences:["family","growth"],audience:"open",circleId:null,support:"encourage",contentNote:null,postedLabel:"1d ago",postedOrder:_e(),text:`My daughter asked why I cried at the school play. I told her the truth: I was proud of her, and I was proud of me for showing up after the year we've had. She said, "Both can be true." She's nine.`,replies:[]},{id:"priya-translating",authorId:"priya",anonymous:!1,experiences:["belonging","identity"],audience:"open",circleId:null,support:"encourage",contentNote:null,postedLabel:"2d ago",postedOrder:_e(),text:"First-generation grad student. Most days I feel like I'm translating myself in two directions at once: for my family, and for the room.",replies:[]},{id:"theo-alone-lonely",authorId:"theo",anonymous:!1,experiences:["healing","growth"],audience:"open",circleId:null,support:"perspective",contentNote:null,postedLabel:"2d ago",postedOrder:_e(),text:"Six months into therapy. I'm learning the difference between being alone and being lonely. One I'm getting good at. The other I'm still sitting with.",replies:[]},{id:"anon-restart-circle",authorId:"anon4",anonymous:!0,experiences:["starting-over"],audience:"circle",circleId:"starting-over",support:"relate",contentNote:null,postedLabel:"2d ago",postedOrder:_e(),text:"Moved back in with my parents at 29. I tell people it's to save money. It's also because I didn't know where else to land.",replies:[]},{id:"kofi-promotion",authorId:"kofi",anonymous:!1,experiences:["career","self-worth"],audience:"circle",circleId:"career-purpose",support:"relate",contentNote:null,postedLabel:"3d ago",postedOrder:_e(),text:"Passed over for the promotion again. Keeping it together at work. Falling apart a little in the car afterwards.",replies:[]},{id:"jordan-applied",authorId:"jordan",anonymous:!1,experiences:["starting-over","career"],audience:"open",circleId:null,support:"encourage",contentNote:null,postedLabel:"3d ago",postedOrder:_e(),text:"Update: I applied for the design course. Didn't get the scholarship yet, but I hit submit, which the old me never would have done.",replies:[]},{id:"anon-holidays",authorId:"anon1",anonymous:!0,experiences:["faith","family"],audience:"circle",circleId:"faith",support:"relate",contentNote:null,postedLabel:"8h ago",postedOrder:93.5,text:"I'm the only one in my family who stopped going to church. Holidays feel like a test I keep failing, even though nobody says a word.",replies:[]},{id:"elena-prayed",authorId:"elena",anonymous:!1,experiences:["faith","healing"],audience:"circle",circleId:"faith",support:"encourage",contentNote:null,postedLabel:"1d ago",postedOrder:88.5,text:"Prayed for the first time in eight years last night. Didn't have the right words. Said them anyway. Something in me unclenched.",replies:[]}];var zh=Q(ie(),1),os=()=>({step:0,text:"",experiences:[],audience:null,circleId:null,anonymous:!1,support:null,contentNote:null,photo:null,photoConsent:!1}),nr=()=>({session:"signedOut",mode:"signup",email:"",displayName:"",confirmedAdultAt:null,reasons:[],experiences:[],somethingElse:"",covenant:null,profile:{photo:null,shortLine:"",learning:"",navigating:[],speakFrom:[],circlesShown:[],audience:{navigating:"me",speakFrom:"me",learning:"me",circles:"me"}},checkin:{arrival:null,heavyDismissed:!1,focus:null},todayIds:null,joined:[],circleInterest:[],reactions:{},connections:[],requested:[],connectDismissed:[],blocked:[],hidden:[],uncovered:[],explainerSeen:!1,stories:structuredClone(kh),draft:os(),plus:{active:!1,via:null,organization:null},journal:[],programsStarted:[],sessionsReserved:[],proApplication:{status:"none",fullName:"",credential:"",state:"",licenseNumber:""},pilotRequested:!1,role:"member",asMember:!1}),wh="human-too-journey-v4";function Gb(){try{let e=sessionStorage.getItem(wh);if(e)return{...nr(),...JSON.parse(e)}}catch{}return nr()}var Ch=(0,Ue.createContext)(null);function Oh({children:e}){let[t,a]=(0,Ue.useState)(Gb),[n,l]=(0,Ue.useState)(null),[i,o]=(0,Ue.useState)(nul
